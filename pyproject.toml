[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kitefinder"
version = "0.1.0"
description = "Finds new and second-hand kitesurfing equipment in Israel and recommends sizes"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "PyYAML>=6.0",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4"]

[project.scripts]
kitefinder = "kitefinder.cli:main"

[tool.setuptools.packages.find]
include = ["kitefinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network and real API keys (run with -m live)"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["kitefinder"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
