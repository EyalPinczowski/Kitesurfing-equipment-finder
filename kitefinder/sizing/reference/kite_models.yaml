# What each kite model is made for, so recommendations and matches respect your riding style.
#   uses: freeride · bigair · freestyle (twin tip riding) · wave (surfboard) · foil
#   An all-round model lists several. Model names are matched ignoring case and suffixes
#   such as SLS, D/LAB, Concept Blue, the year or "V2".
#
# verified: false — from general knowledge of each brand's line-up, not checked against the
# brands' pages (the build environment has no web access). The live suite will compare them.
