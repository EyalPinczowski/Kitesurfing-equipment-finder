    קייט קברינה 12 מטר 2019 - 2500 ש"ח
    קייט קברינה 9 מטר 2019 - 2200 ש"ח
    בר 52 ס"מ - 1000 ש"ח
    טרפז ION מידה M - 400 ש"ח
    נתניה
  expect:
    is_sale: true
    location: Netanya
    items:
      - {type: kite, size: 12, brand: Cabrinha, year: 2019, price: 2500}
      - {type: kite, size: 9, brand: Cabrinha, year: 2019, price: 2200}
      - {type: bar, size: 52, price: 1000}
      - {type: harness, size_label: M, brand: ION, price: 400}

