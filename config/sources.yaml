# Seed configuration. Site URLs added through the bot (/sites add) are stored in the database.
location:
  country: IL
  home_city: ""          # e.g. Tel Aviv — used for distance ranking
  radius_km: 150

facebook:
  enabled: true
  min_delay_s: 8          # random delay between requests, keeps us slow and polite
  max_delay_s: 20
  groups: []              # e.g. - https://m.facebook.com/groups/<group-id>
  marketplace_queries:
    - kitesurf
    - קייטסרפינג
    - קייט
    - טרפז קייט
    - גלשן קייט

yad2:
  enabled: true
  queries: [קייט, kitesurf, קייטסרפינג]

# Seed URLs of shops / listing pages. Loaded into the database once; after that manage them
# with `kitefinder sites ...` or /sites in the bot (removing a seed there is permanent).
sites:
  - https://kitelab.co.il
  - https://kitesurf.co.il
  - https://kitesurfing.co.il/gear/
  - https://www.laguna.co.il/product-category/kites/
  - https://yamitysb.co.il/product-category/surf/%d7%a7%d7%99%d7%99%d7%98-%d7%a1%d7%a8%d7%a4%d7%99%d7%a0%d7%92/

schedule:
  facebook_every_min: 120
  yad2_every_min: 60
  sites_every_min: 180
  lookback_days: 30
