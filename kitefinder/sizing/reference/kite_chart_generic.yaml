# Typical kite size chart (twin tip, intermediate rider, sea level) as published by
# kite schools and brands. Each row: rider weight -> for each wind band (knots) the size
# range in m² the chart recommends.
#
# verified: false — transcribed offline because the build environment cannot reach the
# web. The live suite (pytest -m live) re-checks these numbers against the source pages.
name: generic_twintip_kite_chart
verified: false
sources: []  # filled in with the pages the live check verified against
style: twintip
skill: intermediate
wind_bands_kn: [[10, 12], [12, 15], [15, 18], [18, 22], [22, 26], [26, 30], [30, 35]]
rows:
  - weight_kg: 60
    sizes_m2: [[14, 15], [12, 12], [9, 10], [8, 9], [6, 7], [5, 6], [4, 5]]
  - weight_kg: 70
    sizes_m2: [[15, 17], [13, 14], [10, 12], [9, 10], [7, 8], [6, 7], [5, 5]]
  - weight_kg: 80
    sizes_m2: [[17, 17], [14, 15], [12, 12], [10, 10], [8, 9], [7, 7], [6, 6]]
  - weight_kg: 90
    sizes_m2: [[17, 17], [15, 17], [13, 14], [11, 12], [9, 10], [8, 8], [7, 7]]
