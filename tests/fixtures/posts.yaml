# Labelled corpus of marketplace posts (synthetic, written in the style of Israeli FB groups,
# Yad2 and shop pages). `expect` is the ground truth a correct extraction must produce; only the
# fields listed for an item are checked. Real scraped posts are added in step 4.

- id: he_kite_simple
  text: |
    מוכר קייט North Orbit 12 מטר מודל 2021 במצב מצוין, ללא תיקונים. 3200 ש"ח. הרצליה
  expect:
    is_sale: true
    location: Herzliya
    items:
      - {type: kite, size: 12, brand: North, year: 2021, price: 3200}

- id: he_kite_k_price
  text: |
    למכירה עפיפון דואוטון Evo 9 מ' 2020, שימוש קל, 2.8k. איסוף מחיפה
