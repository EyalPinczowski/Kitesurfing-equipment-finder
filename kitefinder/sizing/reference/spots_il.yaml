# Israeli kitesurfing spots and their typical riding wind (knots) by season.
#   summer = afternoon thermal sea breeze (roughly May–October)
#   winter = storm fronts / south-westerlies (roughly November–April)
# Names are matched case-insensitively, ignoring spaces, hyphens, quotes and Hebrew niqqud.
# A region name expands to all of its spots.
#
# verified: false — typical values from general riding knowledge, not measured data. The live
# suite will compare them with wind statistics once network access is available.
verified: false
sources: []

regions:
  north: [north, צפון, galilee coast, haifa area]
  center: [center, centre, מרכז, sharon, השרון, gush dan, גוש דן]
  south: [south, דרום]
  eilat: [eilat, אילת, red sea, ים סוף]
  kinneret: [kinneret, כנרת, sea of galilee, ים כנרת, galilee lake]

spots:
